<svg xmlns="http://www.w3.org/2000/svg" width="380" height="160" viewBox="0 0 380 160">
  <defs>
    <!-- Glowing Premium Gradient -->
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b57edc" />
      <stop offset="50%" stop-color="#70a5fd" />
      <stop offset="100%" stop-color="#73daca" />
    </linearGradient>
  </defs>

  <!-- Glowing Gradient Border -->
  <rect width="380" height="160" rx="6" fill="#1a1b27" stroke="url(#glow-gradient)" stroke-width="2"/>

  <style>
    .title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #ffffff;
    }
    .desc {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #a9b1d6;
    }
    .badge-rect {
      rx: 4px;
      ry: 4px;
      stroke-width: 1px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 10px;
    }
  </style>

  <!-- Title -->
  <text x="20" y="32" class="title">🚨 SheGuard - Offline AI Safety App</text>

  <!-- Tech Badges -->
  <g transform="translate(20, 48)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="62" height="18" class="badge-rect" fill="rgba(233, 30, 99, 0.1)" stroke="#e91e63" stroke-opacity="0.4"/>
      <text x="7" y="12" class="badge-text" fill="#e91e63">Offline AI</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(68, 0)">
      <rect width="50" height="18" class="badge-rect" fill="rgba(0, 0, 0, 0.1)" stroke="#ffffff" stroke-opacity="0.4"/>
      <text x="7" y="12" class="badge-text" fill="#ffffff">Ollama</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(124, 0)">
      <rect width="62" height="18" class="badge-rect" fill="rgba(66, 133, 244, 0.1)" stroke="#4285f4" stroke-opacity="0.4"/>
      <text x="6" y="12" class="badge-text" fill="#4285f4">Gemma 3n</text>
    </g>
  </g>

  <!-- Description lines -->
  <text x="20" y="94" class="desc">On-device women's safety application using local Gemma 3n</text>
  <text x="20" y="116" class="desc">models running via Ollama for voice-activated threat detection.</text>
</svg>