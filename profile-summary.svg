<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <!-- Background -->
  <rect width="800" height="220" fill="#1a1b27" rx="6" ry="6"/>
  
  <!-- Clip stats column from profile-details card to hide name and wave graph -->
  <defs>
    <clipPath id="clip-stats">
      <rect x="25" y="15" width="300" height="190" rx="6" ry="6"/>
    </clipPath>
  </defs>
  
  <!-- Left Side: Profile Details Stats (Clipped) -->
  <g clip-path="url(#clip-stats)">
    <!-- Shift up by y=-48 to hide name, and x=-15 to align nicely -->
    <image href="https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=amishiverma&theme=tokyonight" x="-15" y="-48" width="450" height="260" />
  </g>
  
  <!-- Right Side: Top Languages Pie Chart -->
  <!-- Aligned seamlessly on the right side of the card -->
  <image href="https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=amishiverma&theme=tokyonight" x="380" y="10" width="400" height="200" />
</svg>
