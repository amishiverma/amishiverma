<svg xmlns="http://www.w3.org/2000/svg" width="380" height="160" viewBox="0 0 380 160">
  <defs>
    <!-- Glowing Premium Gradient -->
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b57edc" />
      <stop offset="50%" stop-color="#70a5fd" />
      <stop offset="100%" stop-color="#73daca" />
    </linearGradient>
  </defs>

  <!-- Glowing Gradient Border -->
  <rect width="380" height="160" rx="6" fill="#1a1b27" stroke="url(#glow-gradient)" stroke-width="2"/>

  <style>
    .title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #ffffff;
    }
    .desc {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #a9b1d6;
    }
    .badge-rect {
      rx: 4px;
      ry: 4px;
      stroke-width: 1px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 10px;
    }
  </style>

  <!-- Title -->
  <text x="20" y="32" class="title">🧠 ReturnIntelligence - AI Reverse Logistics</text>

  <!-- Tech Badges -->
  <g transform="translate(20, 48)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="110" height="18" class="badge-rect" fill="rgba(245, 124, 0, 0.1)" stroke="#f57c00" stroke-opacity="0.4"/>
      <text x="6" y="12" class="badge-text" fill="#f57c00">Reverse Logistics</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(116, 0)">
      <rect width="80" height="18" class="badge-rect" fill="rgba(2, 136, 209, 0.1)" stroke="#0288d1" stroke-opacity="0.4"/>
      <text x="7" y="12" class="badge-text" fill="#0288d1">AI Analytics</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(202, 0)">
      <rect width="56" height="18" class="badge-rect" fill="rgba(0, 150, 136, 0.1)" stroke="#009688" stroke-opacity="0.4"/>
      <text x="7" y="12" class="badge-text" fill="#009688">Next.js</text>
    </g>
  </g>

  <!-- Description lines -->
  <text x="20" y="94" class="desc">AI-driven e-commerce return analytics and logistics optimization platform</text>
  <text x="20" y="116" class="desc">mitigating return fraud and automating restocking workflows.</text>
</svg>
