name: Update GitHub Profile Stats Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual runs

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run update script
        run: python update_stats.py

      - name: Commit and push updated SVG cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update profile stats cards [skip ci]"
          file_pattern: "contributions.svg profile-stats.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
